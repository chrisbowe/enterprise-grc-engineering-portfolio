name: "Compliance & Security Engineering CI"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  compliance-audit:
    name: "Evaluate NIST and CIS Guardrails (OPA)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Open Policy Agent (OPA)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: '1.22.2'

      - name: Run Policy Unit Tests
        run: |
          cd 02-compliance-as-code-pipeline
          chmod +x run_policy_tests.sh
          bash run_policy_tests.sh

  python-tests:
    name: "Python Lab Test Suite (Pytest)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest tests/
